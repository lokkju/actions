name: ci
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'push' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tests/run.sh

  # This repo's own required check, from the workflow at the PR's commit, so a PR that
  # changes the patterns is checked by the patterns it proposes. The job id gives the
  # context "no-ai-attribution / scan".
  no-ai-attribution:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/no-ai-attribution.yml
